<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuchaMania Game Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <!-- Header -->
        <div class="header">
            <div class="logo">🔥 LUCHMANIA 🔥</div>
            <div class="timer-display">
                <span class="timer-label">TIME:</span>
                <span class="timer" id="timer">0:00</span>
            </div>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="team team-1">
                <input type="text" id="team1Name" class="team-name-input" placeholder="Team 1" value="Team 1">
                <div class="team-score" id="team1Score">0</div>
                <div class="turn-indicator team-1-turn hidden" id="turn1">YOUR TURN</div>
            </div>
            <div class="vs-divider">VS</div>
            <div class="team team-2">
                <input type="text" id="team2Name" class="team-name-input" placeholder="Team 2" value="Team 2">
                <div class="team-score" id="team2Score">0</div>
                <div class="turn-indicator team-2-turn hidden" id="turn2">YOUR TURN</div>
            </div>
        </div>

        <!-- Game Board -->
        <div class="game-board" id="gameBoard">
            <!-- Categories and questions will be generated here -->
        </div>

        <!-- Modal for Question -->
        <div class="modal hidden" id="questionModal">
            <div class="modal-content">
                <button class="close-btn" id="closeBtn">&times;</button>
                
                <div class="modal-header">
                    <div class="category-name" id="categoryName"></div>
                    <div class="point-value" id="pointValue"></div>
                </div>

                <!-- Question View -->
                <div class="modal-body question-view hidden" id="questionView">
                    <div class="question-text" id="questionText"></div>
                    <button class="reveal-btn" id="revealBtn">REVEAL ANSWER</button>
                </div>

                <!-- Answer View -->
                <div class="modal-body answer-view hidden" id="answerView">
                    <div class="answer-text" id="answerText"></div>
                    <button class="correct-btn" id="correctBtn">✓ CORRECT</button>
                    <button class="incorrect-btn" id="incorrectBtn">✗ INCORRECT</button>
                </div>

                <!-- Special Space View -->
                <div class="modal-body special-view hidden" id="specialView">
                    <div class="special-icon" id="specialIcon"></div>
                    <div class="special-message" id="specialMessage"></div>
                    <button class="special-btn" id="specialBtn">CONTINUE</button>
                </div>

                <!-- Result View -->
                <div class="modal-body result-view hidden" id="resultView">
                    <div class="result-message" id="resultMessage"></div>
                    <div class="point-awarded" id="pointAwarded"></div>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div class="winner-screen hidden" id="winnerScreen">
            <div class="winner-content">
                <div class="winner-title">🏆 CHAMPION 🏆</div>
                <div class="winner-name" id="winnerName"></div>
                <div class="winner-score" id="winnerScore"></div>
                <button class="reset-game-btn" id="resetGameBtn">NEW GAME</button>
            </div>
        </div>

        <!-- Controls Panel -->
        <div class="controls-panel">
            <button class="control-btn start-btn" id="startBtn">START GAME</button>
            <button class="control-btn reset-btn" id="resetBoardBtn">RESET BOARD</button>
            <button class="control-btn timer-start-btn" id="timerStartBtn">▶ TIMER</button>
            <button class="control-btn timer-stop-btn" id="timerStopBtn">⏸ PAUSE</button>
            <button class="control-btn timer-reset-btn" id="timerResetBtn">⏹ RESET TIMER</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
